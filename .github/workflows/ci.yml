name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MemberPulse.slnx
      - run: dotnet build MemberPulse.slnx --no-restore --configuration Release
      - run: dotnet test MemberPulse.slnx --no-build --configuration Release